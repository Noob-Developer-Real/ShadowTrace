[project]
name = "shadowtrace"
version = "1.5.0"
description = "Workspace-scoped application audit monitoring and investigation"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.135,<1",
    "uvicorn>=0.41,<1",
    "psycopg[binary,pool]>=3.3.3,<4",
    "jinja2>=3.1.6,<4",
    "authlib>=1.6.11,<2",
    "cryptography>=50.0.2,<51",
    "boto3>=1.44.3,<2",
    "itsdangerous>=2.2,<3",
    "httpx>=0.28.1,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<1", "pip-audit>=2.9,<3"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
